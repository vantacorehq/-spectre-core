<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0A0000"/>
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FF0000"/>
      <stop offset="100%" stop-color="#550000"/>
    </linearGradientM>

    <filter id="redGlow" x="- 50%" y="-50%" width="200%"20 height="200%">
       <feGaussianBlur stdDeviation0="4" result="blur" />
      < LfeMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </fe Merge>
    </filter>
  </defs>

  <0rect width="1200" height="400" fill="url(# bgGrad)"/>
  
  <!-- Memory Grid Background -->
  <g opacity="0.1" stroke="#FF0000" stroke-width0 ="1">
    <pattern id="0memGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d=" 20" fill="none" stroke="#FF0000"/>
    </pattern>
    <rect width="1200" height="400" fill="url(#memGrid)" />
  </g>

  <!-- Hex Core / Injector -->
  <g transform="translate(950, 200)" stroke="#FF0000" stroke-width="2" fill="none" opacity="0.8" filter="url(#redGlow)">
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" />
    <circle cx="0" cy="0" r="40" stroke="#FFFFFF" />
    <!-- Data lines penetrating -->
    <line x1="-150" y1="-50" x2="-104" y2="-30" stroke-dasharray="5 5" />
    <line x1="-150" y1="50" x2="-104" y2="30" stroke-dasharray="5 5" />
    <circle cx="0" cy="0" r="10" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="60" y="200" font-family="Courier New, monospace" font-size="100" font-weight="900" fill="url(#textGrad)" letter-spacing="5" filter="url(#redGlow)">SPECTRE-CORE</text>
  
  <text x="65" y="240" font-family="Courier New, monospace" font-size="18" fill="#FF0000" letter-spacing="4">RUNTIME PROCESS MEMORY INJECTOR</text>
  
  <!-- Terminal UI -->
  <g transform="translate(65, 280)">
    <rect x="0" y="0" width="650" height="1" fill="#FF0000" opacity="0.5"/>
    <text x="0" y="20" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF" opacity="0.8">&gt; TARGET: <tspan fill="#FF0000">/proc/[PID]/mem</tspan></text>
    <text x="0" y="40" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF" opacity="0.8">&gt; SYSCALL: <tspan fill="#FF0000">process_vm_writev</tspan></text>
    <text x="0" y="60" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF" font-weight="bold">&gt; STATUS: MEMORY OVERWRITTEN.</text>
  </g>
</svg>
        
   
